<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CardShield Edge architecture</title>
  <desc id="desc">Live synthetic telemetry detection path and separate offline dataset evaluation path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="liveHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="offlineHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOffline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: .2px; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: 1.3px; }
      .box-title { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-body { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box-body-bold { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow-label { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .note { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: .2px; }
      .tiny { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <text x="70" y="58" class="title">CardShield Edge</text>
  <text x="70" y="84" class="subtitle">Embedded, multithreaded payment-abuse detection for merchants</text>

  <!-- Live detection lane -->
  <rect x="55" y="112" width="1490" height="485" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="112" width="1490" height="42" rx="14" fill="url(#liveHeader)"/>
  <rect x="55" y="140" width="1490" height="14" fill="url(#liveHeader)"/>
  <text x="78" y="139" class="lane-title">LIVE DETECTION PATH</text>
  <text x="1285" y="139" class="lane-title">C++17 / TCP / 3 WORKERS</text>

  <!-- live boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="218" width="174" height="150" rx="10" fill="#ecfeff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="290" y="218" width="174" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="500" y="218" width="174" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="710" y="218" width="174" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="920" y="218" width="174" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="1130" y="218" width="174" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="1340" y="218" width="174" height="150" rx="10" fill="#ecfeff" stroke="#0f766e" stroke-width="1.5"/>
  </g>

  <text x="96" y="247" class="box-title">Synthetic Traffic</text>
  <text x="96" y="268" class="box-body-bold">Simulator</text>
  <text x="96" y="295" class="box-body">normal</text>
  <text x="96" y="314" class="box-body">attack</text>
  <text x="96" y="333" class="box-body">mixed</text>
  <text x="96" y="352" class="box-body">dataset-gen (offline)</text>

  <text x="306" y="247" class="box-title">TCP/IP Socket</text>
  <text x="306" y="268" class="box-title">Server</text>
  <text x="306" y="300" class="box-body">listener</text>
  <text x="306" y="320" class="box-body">newline framing</text>
  <text x="306" y="340" class="box-body">JSON validation</text>

  <text x="516" y="247" class="box-title">Producer /</text>
  <text x="516" y="268" class="box-title">Consumer Queue</text>
  <text x="516" y="301" class="box-body">std::mutex</text>
  <text x="516" y="321" class="box-body">condition_variable</text>
  <text x="516" y="341" class="box-body">bounded worker handoff</text>

  <text x="726" y="247" class="box-title">Fixed Worker Pool</text>
  <text x="726" y="281" class="box-body-bold">3 C++ worker threads</text>
  <text x="726" y="311" class="box-body">consume events</text>
  <text x="726" y="331" class="box-body">update source state</text>
  <text x="726" y="351" class="box-body">shared map mutex</text>

  <text x="936" y="247" class="box-title">Source State</text>
  <text x="936" y="281" class="box-body-bold">per-source 60-second</text>
  <text x="936" y="299" class="box-body-bold">sliding window</text>
  <text x="936" y="327" class="box-body">timestamps</text>
  <text x="936" y="346" class="box-body">payment outcomes</text>
  <text x="936" y="365" class="box-body">token / fingerprint behavior</text>

  <text x="1146" y="247" class="box-title">Deterministic</text>
  <text x="1146" y="268" class="box-title">Anomaly Scorer</text>
  <text x="1146" y="299" class="box-body">velocity</text>
  <text x="1146" y="318" class="box-body">failure ratio</text>
  <text x="1146" y="337" class="box-body">timing anomaly</text>
  <text x="1146" y="356" class="box-body">fingerprint anomaly</text>

  <text x="1356" y="247" class="box-title">Periodic Evaluator</text>
  <text x="1356" y="281" class="box-body-bold">every 1 second</text>
  <text x="1356" y="309" class="box-body">source snapshots</text>
  <text x="1356" y="329" class="box-body">weighted final score</text>
  <text x="1356" y="349" class="box-body">NORMAL / SUSPICIOUS /</text>
  <text x="1356" y="365" class="box-body">ATTACK evidence</text>

  <!-- live arrows -->
  <line x1="254" y1="293" x2="290" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <line x1="464" y1="293" x2="500" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <line x1="674" y1="293" x2="710" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <line x1="884" y1="293" x2="920" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <line x1="1094" y1="293" x2="1130" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <line x1="1304" y1="293" x2="1340" y2="293" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <text x="263" y="280" class="arrow-label">events</text>
  <text x="473" y="280" class="arrow-label">valid</text>
  <text x="683" y="280" class="arrow-label">queued</text>
  <text x="893" y="280" class="arrow-label">updates</text>
  <text x="1103" y="280" class="arrow-label">features</text>
  <text x="1313" y="280" class="arrow-label">snapshots</text>

  <!-- evidence and analyst -->
  <line x1="1427" y1="368" x2="1427" y2="430" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowLive)"/>
  <g filter="url(#shadow)">
    <rect x="1130" y="430" width="174" height="122" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="1340" y="430" width="174" height="122" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="1146" y="458" class="box-title">Structured Evidence</text>
  <text x="1146" y="479" class="box-title">JSON</text>
  <text x="1146" y="507" class="box-body">scores and counts</text>
  <text x="1146" y="526" class="box-body">classification</text>
  <text x="1146" y="545" class="box-body">timestamp</text>
  <text x="1356" y="458" class="box-title">Optional AI Analyst</text>
  <text x="1356" y="489" class="box-body">explains evidence</text>
  <text x="1356" y="508" class="box-body">monitor / rate-limit /</text>
  <text x="1356" y="527" class="box-body">escalate to merchant</text>
  <text x="1356" y="546" class="tiny">NOT detector; NOT enforcement</text>
  <line x1="1304" y1="491" x2="1340" y2="491" stroke="#64748b" stroke-width="2" marker-end="url(#arrowLive)"/>

  <!-- Offline evaluation lane -->
  <rect x="55" y="635" width="1490" height="245" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="635" width="1490" height="42" rx="14" fill="url(#offlineHeader)"/>
  <rect x="55" y="663" width="1490" height="14" fill="url(#offlineHeader)"/>
  <text x="78" y="662" class="lane-title">OFFLINE EVALUATION PATH - NO LIVE TCP TRAFFIC</text>
  <text x="1240" y="662" class="lane-title">SYNTHETIC DATA ONLY</text>

  <g filter="url(#shadow)">
    <rect x="90" y="725" width="210" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <rect x="365" y="725" width="210" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <rect x="640" y="725" width="210" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <rect x="915" y="725" width="210" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <rect x="1190" y="725" width="265" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  </g>
  <text x="106" y="755" class="box-title">Dataset Generator</text>
  <text x="106" y="784" class="box-body">80 labeled summaries</text>
  <text x="106" y="803" class="box-body">dataset-gen mode</text>
  <text x="381" y="755" class="box-title">full_dataset.jsonl</text>
  <text x="381" y="784" class="box-body">NORMAL / ATTACK</text>
  <text x="381" y="803" class="box-body">synthetic records</text>
  <text x="656" y="755" class="box-title">Train / Holdout Split</text>
  <text x="656" y="784" class="box-body">56 development</text>
  <text x="656" y="803" class="box-body">24 held-out</text>
  <text x="931" y="755" class="box-title">Held-out Evaluation</text>
  <text x="931" y="784" class="box-body">fixed detector formula</text>
  <text x="931" y="803" class="box-body">no learned training phase</text>
  <text x="1206" y="755" class="box-title">Metrics</text>
  <text x="1206" y="784" class="box-body">precision / recall / F1</text>
  <text x="1206" y="803" class="box-body">FP / FN and FP cost</text>

  <line x1="300" y1="775" x2="365" y2="775" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOffline)"/>
  <line x1="575" y1="775" x2="640" y2="775" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOffline)"/>
  <line x1="850" y1="775" x2="915" y2="775" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOffline)"/>
  <line x1="1125" y1="775" x2="1190" y2="775" stroke="#b45309" stroke-width="3" marker-end="url(#arrowOffline)"/>

  <!-- defense note -->
  <rect x="55" y="915" width="1490" height="42" rx="10" fill="#172554"/>
  <text x="800" y="942" text-anchor="middle" class="note">Defense-only  •  Synthetic identifiers only  •  No real card numbers  •  No automatic blocking</text>
</svg>
